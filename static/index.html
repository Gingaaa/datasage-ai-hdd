<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Data Dictionary Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                <h1>IDD Agent</h1>
            </div>
            <p class="subtitle">Universal Data Intelligence</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel (Upload & Report) -->
            <section class="data-panel">
                <!-- Unified Upload Zone -->
                <div id="upload-section" class="upload-zone glass-card">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <h2>Upload Any Data</h2>
                    <p id="upload-instruction">Drag & drop CSV, PDF, DOCX, PPTX, MP4, or TXT here</p>
                    <input type="file" id="file-input" accept="*/*" hidden>
                    <button class="btn primary-btn" onclick="document.getElementById('file-input').click()">Browse Files</button>
                    
                    <div class="divider"><span>OR</span></div>
                    
                    <div class="raw-text-zone">
                        <textarea id="raw-text-input" placeholder="Paste your raw text here..."></textarea>
                        <button class="btn secondary-btn" id="submit-text-btn">Process Text</button>
                    </div>

                    <div id="upload-status" class="status-message"></div>
                </div>

                <!-- Report View Section -->
                <div id="report-section" class="report-view glass-card hidden">
                    <div class="section-header">
                        <h2>Analytics Report</h2>
                        <div class="header-actions">
                            <div class="dropdown">
                                <button class="btn secondary-btn" id="export-dropdown-btn" title="Export Report">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                    Export As ▼
                                </button>
                                <div class="dropdown-content" id="export-options">
                                    <a href="#" id="export-pdf">PDF Document</a>
                                    <a href="#" id="export-docx">Word (DOCX)</a>
                                    <a href="#" id="export-pptx">PowerPoint (PPTX)</a>
                                    <a href="#" id="export-md">Markdown (MD)</a>
                                </div>
                            </div>
                            <button class="btn icon-btn" id="reset-btn" title="Upload new data">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    <div id="report-content" class="markdown-body">
                        <!-- Markdown report populated by JS -->
                    </div>
                </div>
            </section>

            <!-- Right Panel (Chat Agent) -->
            <section class="agent-panel glass-card">
                <div class="chat-header">
                    <div class="agent-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path><path d="M9 14h.01"></path><path d="M15 14h.01"></path></svg>
                    </div>
                    <h2>Data Assistant</h2>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message system-msg">
                        <p>Upload any data file to start exploring!</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ask about your data..." disabled>
                    <button class="btn primary-btn send-btn" id="send-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
